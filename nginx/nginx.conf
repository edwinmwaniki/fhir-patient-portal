# Nginx reverse proxy in front of the Gunicorn-served Django API and the
# built Angular SPA. Terminates HTTP for the Docker stack; TLS termination
# should be layered on top in production (either here or at an upstream
# load balancer).

# The `web` service name resolves via Docker's embedded DNS.
upstream django_upstream {
    server web:8000;
    keepalive 32;
}

# Basic rate-limit zone; tuned intentionally loose for a demo but present
# so operators have an obvious knob to tighten in production.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Do not advertise the upstream stack version.
    server_tokens off;

    # Reasonable body size for FHIR JSON payloads; individual resources are
    # small but Bundles can grow.
    client_max_body_size 5m;

    # Log format includes upstream timing so slow endpoints are easy to
    # spot in production.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Shared proxy defaults reused by every location that forwards to
    # Gunicorn. Django reads X-Forwarded-Proto via SECURE_PROXY_SSL_HEADER
    # to detect that requests originated over TLS.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Health probe: bypasses rate-limits and never touches the SPA fallback.
    location = /healthz {
        proxy_pass http://django_upstream;
        access_log off;
    }

    # FHIR REST API. Rate-limited and forwarded straight to Gunicorn.
    location /api/ {
        limit_req zone=api_rl burst=60 nodelay;
        proxy_pass http://django_upstream;
    }

    # Django admin (kept behind the same proxy so operators can reach it
    # without a second hostname).
    location /admin/ {
        proxy_pass http://django_upstream;
    }

    # Django-collected static files (admin CSS/JS, DRF browsable API).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA. `try_files` falls back to index.html so client-side
    # routes deep-link correctly.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
