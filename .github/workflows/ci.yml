name: CI

# Runs on every push and PR. Configure a branch protection rule that
# requires the `test` job to pass before merging into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11 + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fhir_portal_test
          POSTGRES_USER: fhir_portal
          POSTGRES_PASSWORD: fhir_portal_ci_password
        ports:
          - 5432:5432
        # Health check gates job startup so the test process never races
        # against a not-yet-ready database.
        options: >-
          --health-cmd "pg_isready -U fhir_portal -d fhir_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Django / test runtime. No production secrets live here; the values
      # are scoped to the ephemeral service container above.
      DJANGO_SETTINGS_MODULE: fhir_portal.settings
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: fhir_portal_test
      POSTGRES_USER: fhir_portal
      POSTGRES_PASSWORD: fhir_portal_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are up to date
        # Fails the job if a model change was committed without a paired
        # migration, keeping schema drift out of main.
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest
        run: pytest --maxfail=1
